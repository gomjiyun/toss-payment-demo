<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>결제 실패</title>
  <style>
    body {
        font-family: sans-serif;
        background-color: #fff0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 100px;
    }
    .card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        text-align: center;
    }
    h1 {
        color: #cc0000;
    }
    a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        text-decoration: none;
        background-color: #cc0000;
        color: white;
        border-radius: 8px;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>😥 결제에 실패했습니다</h1>
  <p>다시 시도해주시거나, 관리자에게 문의해주세요.</p>
  <a href="/payment">결제 페이지로 돌아가기</a>
</div>
</body>
</html>
